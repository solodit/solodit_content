name: Deploy

on:
  push:
    branches: [ 'main' ]

permissions: {}

jobs:
  deployment:
    runs-on: ubuntu-latest
    env:
      SOLODIT_API: https://solodit-backend.cyfrin.dev/api/general
      SOLODIT_USER: ${{ secrets.SOLODIT_USER }}
      SOLODIT_PASSWORD: ${{ secrets.SOLODIT_PASSWORD }}
    steps:
    - name: Refresh tags and categories, protocol forks, reports and bug bounties
      run: |
        set -euo pipefail
        for endpoint in refresh_tag_category refresh_forked_protocol import_reports refresh_bug_bounties; do
          response=$(curl --fail-with-body -sS -X POST "$SOLODIT_API/$endpoint/" \
            --data-urlencode "email=$SOLODIT_USER" \
            --data-urlencode "password=$SOLODIT_PASSWORD")
          echo "$endpoint: $response"
          if ! grep -q '"result": true' <<< "$response"; then
            echo "::error::$endpoint failed: $response"
            exit 1
          fi
        done
